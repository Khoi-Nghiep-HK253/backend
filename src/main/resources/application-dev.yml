spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/divvy
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Dev mail: use a dummy config — actual sending is disabled via app.mail.enabled=false
  # The reset link will be logged to console instead
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

# ── Dev overrides ─────────────────────────────────────────────────────────────
app:
  mail:
    enabled: false   # Logs reset link to console instead of sending real email

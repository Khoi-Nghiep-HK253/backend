spring:
  application:
    name: main

  profiles:
    active: dev

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Enable @Async for EmailServiceImpl
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

  # ── Multipart Upload Limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    flyway:
      enabled: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

# ── Password Reset ────────────────────────────────────────────────────────────
app:
  reset-password:
    expiry-minutes: 30
    # Override in profile-specific YML or env var for production frontend URL
    base-url: ${APP_RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}
  mail:
    from: ${APP_MAIL_FROM:no-reply@divvy.app}
    enabled: ${APP_MAIL_ENABLED:true}

# ── Cloudinary CDN ────────────────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

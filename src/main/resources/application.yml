spring:
  application:
    name: main

  profiles:
    active: dev

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Enable @Async for EmailServiceImpl
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

  # ── Multipart Upload Limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # ── Mail Configuration ────────────────────────────────────────────────────────
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
      mail.smtp.connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:10000}
      mail.smtp.timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    flyway:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# ── Application Config ────────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  reset-password:
    expiry-minutes: 30
  mail:
    from: ${APP_MAIL_FROM:no-reply@divvy.app}
    enabled: ${APP_MAIL_ENABLED:true}

# ── Cloudinary CDN ────────────────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
spring:
  application:
    name: main

  profiles:
    active: dev

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Enable @Async for EmailServiceImpl
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

  # ── Multipart Upload Limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    flyway:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# ── Application Config ────────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  reset-password:
    expiry-minutes: 30
  mail:
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${APP_MAIL_FROM:onboarding@resend.dev}
    enabled: ${APP_MAIL_ENABLED:true}

# ── Cloudinary CDN ────────────────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
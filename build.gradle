plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hcmut'
version = '0.0.1-SNAPSHOT'
description = 'main'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ── Flyway ────────────────────────────────────────────────────────────────
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Prisma-like Migration Task ───────────────────────────────────────────────
// Usage:
//   .\gradlew migrateDev -PmigrationName=create_core_tables
//   .\gradlew migrateDev -PmigrationName=add_user_avatar
//
// What it does:
//   1. Compares JPA Entities against running PostgreSQL DB
//   2. Generates ONLY the diff DDL (CREATE TABLE, ALTER TABLE, ADD COLUMN...)
//   3. Outputs a timestamped Flyway SQL migration file in src/main/resources/db/migration/
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('migrateDev', JavaExec) {
    dependsOn 'classes'
    group = 'migration'
    description = 'Prisma-like migrate dev: compares JPA entities against DB and creates a timestamped Flyway migration file'

    mainClass = 'com.hcmut.divvy.generator.MigrationGenerator'
    classpath = sourceSets.main.runtimeClasspath

    def migName = project.hasProperty('migrationName') ? project.property('migrationName') :
                  (project.hasProperty('name') && project.property('name') != project.name ? project.property('name') : 'schema_update')
    systemProperty 'migration.name', migName
}
